{% extends "base.html" %}
{% block title %}My trips{% endblock %}
{% block content %}
<main class="page">
  <section class="home-head">
    <h1>My trips</h1>
    <div class="tabs" role="tablist">
      <button class="tab active" data-filter="all" role="tab">All</button>
      <button class="tab" data-filter="confirmed" role="tab">Confirmed</button>
      <button class="tab" data-filter="cancelled" role="tab">Cancelled</button>
    </div>
  </section>
  <section id="trip-list" class="trip-list" aria-live="polite"><p class="muted">Loading your trips...</p></section>
</main>

<div class="modal" id="edit-modal" hidden>
  <div class="modal-card" role="dialog" aria-modal="true" aria-labelledby="edit-title">
    <h2 id="edit-title">Edit trip</h2>
    <p class="muted" id="edit-sub"></p>
    <form id="edit-form" novalidate>
      <label>Travel date<input type="date" name="travel_date" required></label>
      <label>Travelers<input type="number" name="travelers" min="1" max="20" required></label>
      <label>Notes<textarea name="notes" rows="3" maxlength="300"></textarea></label>
      <div class="total-row"><span>Total</span><strong id="edit-total">$0</strong></div>
      <p class="form-error" id="edit-error" role="alert"></p>
      <div class="modal-actions">
        <button type="button" class="btn btn-ghost" data-close>Close</button>
        <button type="submit" class="btn btn-primary">Save changes</button>
      </div>
    </form>
  </div>
</div>
{% endblock %}
{% block scripts %}<script src="{{ url_for('static', filename='js/trips.js') }}"></script>{% endblock %}
